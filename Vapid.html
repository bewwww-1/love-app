<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>สร้างคีย์ VAPID</title>
<body style="font-family:sans-serif;max-width:560px;margin:24px auto;padding:0 16px">
<h2>สร้างคีย์ VAPID</h2>
<p>กดปุ่มแล้วคัดลอกคีย์ไปใช้ จากนั้น <b>ลบไฟล์ vapid.html ออกจาก GitHub</b> ทันที คีย์สร้างในเครื่องคุณเท่านั้น ไม่ได้ส่งไปที่ไหน</p>
<button id="g" style="padding:12px 18px;font-size:16px">สร้างคีย์</button>
<p><b>Public key</b> (ใส่ใน config.js และ Secret ชื่อ VAPID_PUBLIC)</p><textarea id="pub" rows="3" style="width:100%" readonly></textarea>
<p><b>Private key</b> (ใส่ใน Secret ชื่อ VAPID_PRIVATE เท่านั้น ห้ามบอกใคร)</p><textarea id="prv" rows="2" style="width:100%" readonly></textarea>
<script>
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
g.onclick=async()=>{const k=await crypto.subtle.generateKey({name:"ECDSA",namedCurve:"P-256"},true,["sign"]);
pub.value=b64(await crypto.subtle.exportKey("raw",k.publicKey));prv.value=(await crypto.subtle.exportKey("jwk",k.privateKey)).d};
</script></body></html>
