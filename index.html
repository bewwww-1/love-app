<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ใกล้กัน – ดูตำแหน่งและโทรคุยกับคนพิเศษ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap">
<style>
:root{--bg:#f7f3f2;--fg:#2a2230;--muted:#756b7c;--card:#fff;--line:#e4dcde;--me:#d83b68;--you:#12878c;--on:#fff;--grid:#e9e1e3;--ok:#2e9a5b;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141a;--fg:#f1ebf3;--muted:#a79cae;--card:#231e29;--line:#383040;--me:#ff6f95;--you:#3fc7cc;--on:#1c0710;--grid:#2c2533;--ok:#5fd08d}}
:root[data-theme="dark"]{--bg:#17141a;--fg:#f1ebf3;--muted:#a79cae;--card:#231e29;--line:#383040;--me:#ff6f95;--you:#3fc7cc;--on:#1c0710;--grid:#2c2533;--ok:#5fd08d}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Prompt","Noto Sans Thai",system-ui,sans-serif;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:0 16px 14px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px}
h1{margin:0;font-size:22px;font-weight:600}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
.pill.on{color:var(--ok);border-color:var(--ok)}
section{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
input{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:11px 14px;border-radius:12px;cursor:pointer}
button.p{background:var(--me);color:var(--on);border-color:var(--me);font-weight:500}
button.g{background:var(--you);color:var(--on);border-color:var(--you);font-weight:500}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--you);outline-offset:2px}
.row{display:flex;gap:10px}.row>*{flex:1}
.note{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0}
#cv{width:100%;flex:1;min-height:200px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
#gm{width:100%;flex:1;min-height:240px;border-radius:14px;border:1px solid var(--line);overflow:hidden}
.iw{display:flex;align-items:center;gap:8px;font-family:Prompt,sans-serif;color:#2a2230;padding:2px 4px}.iw small{display:block;color:#756b7c}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:600;width:36px;height:36px;flex:none}
#pop{position:fixed;inset:0;z-index:50;background:rgba(10,8,14,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px}
#pop .box{background:var(--card);border-radius:22px;padding:28px 24px 22px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}
#pop .av{width:96px;height:96px;font-size:40px;position:relative;margin:6px auto 16px;background:var(--you)}
#pop.ring .av::before,#pop.ring .av::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--you);animation:pul 1.6s infinite}
#pop.ring .av::after{animation-delay:.8s}
@keyframes pul{from{transform:scale(1);opacity:.8}to{transform:scale(1.7);opacity:0}}
#pop h2{margin:0;font-size:22px}#pop p{margin:4px 0 22px;color:var(--muted);font-size:14px}
#pop .btns{display:flex;justify-content:center;gap:34px}
#pop .btns div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
#pop .rb{width:62px;height:62px;border-radius:50%;padding:0;font-size:26px;border:0;color:#fff}
#ptt{width:100%;padding:18px;margin-bottom:20px;font-size:17px;touch-action:none;user-select:none;-webkit-user-select:none}#ptt.on{background:var(--ok);border-color:var(--ok)}#wkl{display:block;margin:-10px 0 16px;font-size:13px;color:var(--muted)}#wkl input{width:auto;vertical-align:middle;margin-right:6px}
.rb.ok{background:#2e9a5b}.rb.no{background:#e0364f}.rb.mu{background:var(--line);color:var(--fg)}.rb.mu.on{background:var(--fg);color:var(--bg)}
.fr{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.fr .gr{flex:1;min-width:0}.fr small{display:block;color:var(--muted);font-size:12px}.fr button{padding:8px 11px;font-size:13px}.fr .av{background:var(--you)}
h3{margin:0 0 4px;font-size:15px}
#dist{font-size:20px;font-weight:600;margin:0}#sub{margin:2px 0 0;font-size:13px;color:var(--muted)}
#bar{display:flex;align-items:center;gap:10px;justify-content:space-between}
#err{color:var(--me);font-size:13px;margin:0}
a{color:var(--you)}
</style>
</head>
<body>
<header><h1>ใกล้กัน</h1><span class="pill" id="conn">กำลังเชื่อมต่อ</span></header>

<section id="login">
  <div class="card"><label for="em">อีเมลของคุณ</label><input id="em" type="email" autocomplete="email" placeholder="you@example.com"><label for="pw" style="margin-top:10px">รหัสผ่าน (อย่างน้อย 6 ตัว)</label><input id="pw" type="password" autocomplete="current-password" placeholder="รหัสผ่าน"><div class="row" style="margin-top:10px"><button class="p" id="signin">เข้าสู่ระบบ</button><button class="g" id="signup">สมัครสมาชิก</button></div></div>
  <p class="note">ครั้งแรกให้กดสมัครสมาชิก ไม่ต้องยืนยันอีเมล ตำแหน่งจะถูกแชร์ก็ต่อเมื่อคุณกดเอง และเพื่อนที่คุณรับแล้วเท่านั้นที่เห็นได้</p><p id="err"></p>
</section>
<section id="prof" hidden>
  <div class="card"><label for="un">ชื่อผู้ใช้ (a-z 0-9 _ 3 ถึง 20 ตัว ให้เพื่อนค้นหา)</label><input id="un" maxlength="20" autocapitalize="none" autocomplete="off" placeholder="เช่น meow_99">
  <label for="dn" style="margin-top:10px">ชื่อที่เพื่อนจะเห็น</label><input id="dn" maxlength="20" placeholder="เช่น แมว"><button class="p" id="saveprof" style="width:100%;margin-top:10px">บันทึก</button></div><p id="perr" style="color:var(--me);font-size:13px;margin:0"></p>
</section>
<section id="home" hidden style="overflow:auto">
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><b id="meN"></b><div class="note" id="meU"></div></div><div class="row" style="flex:0 0 auto"><button id="invite">คัดลอกลิงก์เชิญ</button><button id="logout">ออก</button></div></div></div>
  <div class="card"><label for="fu">เพิ่มเพื่อนด้วยชื่อผู้ใช้</label><div class="row"><input id="fu" placeholder="@username" autocapitalize="none" autocomplete="off"><button class="g" id="addf" style="flex:0 0 auto">ส่งคำขอ</button></div><p class="note" id="hmsg" style="margin-top:8px"></p></div>
  <div class="card" id="rqh" hidden><h3>คำขอเป็นเพื่อน</h3><div id="reqs"></div></div>
  <div class="card"><h3>เพื่อน</h3><div id="fl"></div></div>
  <p class="note">เพื่อนจะได้รับสายเมื่อเปิดแอปหน้านี้อยู่เท่านั้น</p>
</section>

<section id="main" hidden>
  <div class="card" id="bar"><div><div style="font-size:13px;color:var(--muted)">คุยกับ <b id="rc"></b></div><div id="who" style="font-weight:500"></div></div><button id="copy">← กลับ</button></div>
  <div id="gm" hidden></div><canvas id="cv"></canvas>
  <div class="card"><p id="dist">รอตำแหน่ง</p><p id="sub"></p><a id="map" href="#" target="_blank" rel="noopener noreferrer" hidden>เปิดตำแหน่งคู่ในแผนที่</a></div>
  <div class="card" id="callbar" hidden><div id="calltxt" style="margin-bottom:8px"></div><div class="row" id="ringbtns" hidden><button class="g" id="acc">รับสาย</button><button id="dec">ปฏิเสธ</button></div></div>
  <div class="row"><button class="p" id="share">แชร์ตำแหน่งของฉัน</button><button class="g" id="call" disabled>โทรหาคู่</button></div>
  <p class="note" id="warn"></p>
  <div id="pop" hidden><div class="box"><div class="av" id="pav">?</div><h2 id="pname"></h2><p id="ptxt"></p>
  <label id="wkl" hidden><input type="checkbox" id="wk">โหมดวอล์กกี้ กดค้างเพื่อพูด ปล่อยเพื่อฟัง</label><button class="p" id="ptt" hidden>กดค้างเพื่อพูด</button>
  <div class="btns" id="pring"><div><button class="rb no" id="dec2" aria-label="ปฏิเสธ">✕</button>ปฏิเสธ</div><div><button class="rb ok" id="acc2" aria-label="รับสาย">✆</button>รับสาย</div></div>
  <div class="btns" id="pcall"><div><button class="rb mu" id="mute" aria-label="ปิดเสียงไมค์">🎙</button>ปิดไมค์</div><div><button class="rb no" id="hang" aria-label="วางสาย">✆</button>วางสาย</div></div>
</div></div>
<audio id="ra" autoplay playsinline></audio>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
// ---- ช่องสัญญาณเรียลไทม์ผ่าน Supabase Realtime (Presence + Broadcast) ----
const CFG=window.DUO_CONFIG||{};
const cfgBad=!CFG.SUPABASE_URL||!CFG.SUPABASE_ANON_KEY||/YOUR-PROJECT|YOUR_SUPABASE/.test(CFG.SUPABASE_URL+CFG.SUPABASE_ANON_KEY);
let sb=null;try{if(!cfgBad&&window.supabase)sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY)}catch(e){console.error(e)}
function joinRoom(name){return new Promise((resolve,reject)=>{
 if(cfgBad){reject(new Error("config"));return}
 if(!sb){reject(new Error("lib"));return}
 const key=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)),ch=sb.channel(name,{config:{presence:{key},broadcast:{self:false}}});
 let my={},peers=[],conn=false,done=false;const pl=[],cl=[],ml={};
 const sync=()=>{const st=ch.presenceState();peers=Object.entries(st).map(([k,a])=>({peer:k,by:null,isMe:k===key,sameTab:k===key,kind:"viewer",guest:false,presence:a[a.length-1]||{},updatedAt:Date.now()}));pl.forEach(f=>f({peers}))};
 ch.on("presence",{event:"sync"},sync);
 ch.on("broadcast",{event:"rtc"},({payload})=>{const p=peers.find(x=>x.peer===payload.from);(ml.rtc||[]).forEach(f=>f({isMe:false,peer:payload.from,presence:p?p.presence:{},data:payload.data}))});
 const room={
  presence:async patch=>{my={...my,...patch};Object.keys(my).forEach(k=>my[k]===null&&delete my[k]);if(conn)await ch.track(my)},
  peers:()=>peers,onPeers:f=>{pl.push(f)},onConnection:f=>{cl.push(f)},connected:()=>conn,leave:()=>{conn=false;sb.removeChannel(ch)},
  on:(t,f)=>{(ml[t]=ml[t]||[]).push(f)},
  emit:(t,data)=>ch.send({type:"broadcast",event:t,payload:{from:key,data}})};
 ch.subscribe(async (st,e)=>{if(e)console.error("Realtime:",st,e);
  if(st==="SUBSCRIBED"){conn=true;await ch.track(my);cl.forEach(f=>f(true));sync();if(!done){done=true;resolve(room)}}
  else if(["CHANNEL_ERROR","TIMED_OUT","CLOSED"].includes(st)){conn=false;cl.forEach(f=>f(false));if(!done){done=true;reject(new Error(st))}}});
 setTimeout(()=>{if(!done){done=true;reject(new Error("timeout"))}},12000)})}
let gmap=null,gmk={},gline=null,gN=0,gmOK=false;
if(CFG.GOOGLE_MAPS_KEY&&!/YOUR/.test(CFG.GOOGLE_MAPS_KEY)){window.__gm=()=>{gmOK=true;render()};window.gm_authFailure=()=>{gmOK=false;$("gm").hidden=true;$("cv").hidden=false;render()};
 const sc=document.createElement("script");sc.async=true;sc.src="https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(CFG.GOOGLE_MAPS_KEY)+"&callback=__gm&language=th";document.head.appendChild(sc)}
function iwNode(p){const d=document.createElement("div");d.className="iw";const a=document.createElement("span");a.className="av";a.style.background=p.c;a.textContent=[...p.n][0]||"?";const t=document.createElement("div"),b=document.createElement("b");b.textContent=p.n;t.appendChild(b);if(p.sub){const m=document.createElement("small");m.textContent=p.sub;t.appendChild(m)}d.append(a,t);return d}
function drawMap(pts){$("gm").hidden=false;$("cv").hidden=true;
 if(!gmap)gmap=new google.maps.Map($("gm"),{center:{lat:13.75,lng:100.5},zoom:11,disableDefaultUI:true,zoomControl:true,clickableIcons:false});
 const keep={};pts.forEach(p=>{keep[p.k]=1;const pos={lat:p.lat,lng:p.lng},ic={path:google.maps.SymbolPath.CIRCLE,scale:10,fillColor:p.c,fillOpacity:1,strokeColor:"#fff",strokeWeight:3};
  let o=gmk[p.k];if(!o){o=gmk[p.k]={m:new google.maps.Marker({map:gmap,position:pos,icon:ic}),w:new google.maps.InfoWindow()};o.m.addListener("click",()=>o.open?(o.w.close(),o.open=false):(o.w.open(gmap,o.m),o.open=true));o.w.open(gmap,o.m);o.open=true}
  else{o.m.setPosition(pos);o.m.setIcon(ic)}o.w.setContent(iwNode(p))});
 Object.keys(gmk).forEach(k=>{if(!keep[k]){gmk[k].w.close();gmk[k].m.setMap(null);delete gmk[k]}});
 if(gline){gline.setMap(null);gline=null}
 if(pts.length===2)gline=new google.maps.Polyline({map:gmap,path:pts.map(p=>({lat:p.lat,lng:p.lng})),strokeColor:"#756b7c",strokeOpacity:.8,strokeWeight:2});
 if(pts.length!==gN){gN=pts.length;if(pts.length===1){gmap.setCenter({lat:pts[0].lat,lng:pts[0].lng});gmap.setZoom(16)}else if(pts.length===2){const b=new google.maps.LatLngBounds();pts.forEach(p=>b.extend({lat:p.lat,lng:p.lng}));gmap.fitBounds(b,70)}}}
const $=id=>document.getElementById(id),css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const DIR=["เหนือ","ตะวันออกเฉียงเหนือ","ตะวันออก","ตะวันออกเฉียงใต้","ใต้","ตะวันตกเฉียงใต้","ตะวันตก","ตะวันตกเฉียงเหนือ"];
let room,nick="",code="",watch=null,sharing=false,myPos=null,pc=null,stream=null,pend=[],incoming=null,callPeer=null,inCall=false;
const err=t=>$("err").textContent=t||"";

const el=(t,a={},...k)=>{const e=document.createElement(t);Object.assign(e,a);e.append(...k);return e};
const bt=(t,c,f)=>el("button",{textContent:t,className:c||"",onclick:f}),norm=u=>u.trim().replace(/^@/,"").toLowerCase();
const showS=id=>["login","prof","home","main"].forEach(x=>$(x).hidden=x!==id);
let me=null,myProf=null,inbox=null,friends=[],wantCall=false,autoAcc=false,ringIn=null;
const hmsg=t=>$("hmsg").textContent=t||"";
function inboxSend(to,payload){const ch=sb.channel("inbox-"+to);ch.subscribe(st=>{if(st==="SUBSCRIBED")ch.send({type:"broadcast",event:"ring",payload}).finally(()=>setTimeout(()=>sb.removeChannel(ch),1500))})}
async function onSession(ss){if(!ss){me=null;myProf=null;if(inbox){sb.removeChannel(inbox);inbox=null}showS("login");return}
 if(me&&me.id===ss.user.id)return;me=ss.user;const{data}=await sb.from("profiles").select("*").eq("id",me.id).maybeSingle();
 if(!data){showS("prof");return}myProf=data;startHome()}
const authGo=async mode=>{const email=$("em").value.trim(),password=$("pw").value;if(!email||!password){err("ใส่อีเมลและรหัสผ่านก่อนนะ");return}if(password.length<6){err("รหัสผ่านต้องมีอย่างน้อย 6 ตัว");return}if(!sb){err("ยังไม่ได้ตั้งค่า config.js");return}
 err("กำลังดำเนินการ…");const r=mode==="up"?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
 if(r.error){const m=r.error.message||"";err(/already registered/i.test(m)?"อีเมลนี้สมัครแล้ว กดเข้าสู่ระบบแทน":/invalid login/i.test(m)?"อีเมลหรือรหัสผ่านไม่ถูกต้อง (ถ้ายังไม่เคยสมัคร กดสมัครสมาชิกก่อน)":/rate limit/i.test(m)?"ลองบ่อยเกินไป รอสักครู่แล้วลองใหม่":m);return}
 if(mode==="up"&&!r.data.session){err("สมัครแล้ว แต่โปรเจกต์ยังเปิดยืนยันอีเมลอยู่ ให้ปิด Confirm email ใน Supabase แล้วกดเข้าสู่ระบบ");return}err("")};
$("signin").onclick=()=>authGo("in");$("signup").onclick=()=>authGo("up");
$("saveprof").onclick=async()=>{const u=norm($("un").value),n=$("dn").value.trim(),pe=$("perr");if(!/^[a-z0-9_]{3,20}$/.test(u)){pe.textContent="ชื่อผู้ใช้ต้องเป็น a-z 0-9 _ ยาว 3 ถึง 20 ตัว";return}if(!n){pe.textContent="ใส่ชื่อที่เพื่อนจะเห็น";return}
 const{error}=await sb.from("profiles").insert({id:me.id,username:u,name:n});if(error){pe.textContent=error.code==="23505"?"ชื่อผู้ใช้นี้มีคนใช้แล้ว":"บันทึกไม่ได้: "+error.message;return}
 myProf={id:me.id,username:u,name:n};startHome()};
$("logout").onclick=()=>sb.auth.signOut();
$("invite").onclick=async()=>{const u=location.origin+location.pathname+"?add="+myProf.username;try{await navigator.clipboard.writeText(u);$("invite").textContent="คัดลอกแล้ว"}catch(e){prompt("คัดลอกลิงก์นี้ส่งให้เพื่อน",u)}setTimeout(()=>$("invite").textContent="คัดลอกลิงก์เชิญ",1800)};
async function startHome(){showS("home");$("meN").textContent=myProf.name;$("meU").textContent="@"+myProf.username;
 if(!inbox){inbox=sb.channel("inbox-"+me.id).on("broadcast",{event:"ring"},({payload})=>onRing(payload)).subscribe()}
 await loadFriends();const a=new URLSearchParams(location.search).get("add");if(a){history.replaceState(null,"",location.pathname);await addFriend(norm(a))}}
async function addFriend(u){hmsg("");if(!u)return;if(u===myProf.username){hmsg("นั่นคือชื่อของคุณเอง");return}
 const{data:p}=await sb.from("profiles").select("id,name").eq("username",u).maybeSingle();if(!p){hmsg("ไม่พบ @"+u);return}
 const{data:rv}=await sb.from("friendships").select("id,status").eq("requester",p.id).eq("addressee",me.id).maybeSingle();
 if(rv){if(rv.status==="pending")await sb.from("friendships").update({status:"accepted"}).eq("id",rv.id);hmsg("เป็นเพื่อนกับ "+p.name+" แล้ว");loadFriends();return}
 const{error}=await sb.from("friendships").insert({requester:me.id,addressee:p.id});hmsg(error?(error.code==="23505"?"ส่งคำขอไปแล้ว":"ส่งไม่ได้: "+error.message):"ส่งคำขอถึง "+p.name+" แล้ว");$("fu").value="";loadFriends()}
$("addf").onclick=()=>addFriend(norm($("fu").value));
const rmF=async(id,q)=>{if(q&&!confirm(q))return;await sb.from("friendships").delete().eq("id",id);loadFriends()};
function frow(name,sub,...b){const a=el("span",{className:"av",textContent:[...name][0]||"?"});return el("div",{className:"fr"},a,el("div",{className:"gr"},el("b",{textContent:name}),el("small",{textContent:sub})),...b)}
async function loadFriends(){if(!me)return;const{data:fs,error}=await sb.from("friendships").select("*").or("requester.eq."+me.id+",addressee.eq."+me.id);
 if(error){hmsg("โหลดเพื่อนไม่ได้ ตรวจว่ารัน schema.sql ใน Supabase แล้ว");return}
 const ids=[...new Set(fs.map(f=>f.requester===me.id?f.addressee:f.requester))],{data:ps}=ids.length?await sb.from("profiles").select("*").in("id",ids):{data:[]},pm=Object.fromEntries((ps||[]).map(p=>[p.id,p]));
 friends=[];const rq=$("reqs"),fl=$("fl");rq.replaceChildren();fl.replaceChildren();
 fs.forEach(f=>{const p=pm[f.requester===me.id?f.addressee:f.requester];if(!p)return;const sub="@"+p.username;
  if(f.status==="accepted"){const fr={id:p.id,name:p.name};friends.push(fr);fl.append(frow(p.name,sub,bt("โทร","g",()=>openFriend(fr,true)),bt("ตำแหน่ง","",()=>openFriend(fr,false)),bt("ลบ","",()=>rmF(f.id,"ลบเพื่อนคนนี้?"))))}
  else if(f.addressee===me.id)rq.append(frow(p.name,sub+" ขอเป็นเพื่อน",bt("รับ","g",async()=>{await sb.from("friendships").update({status:"accepted"}).eq("id",f.id);loadFriends()}),bt("ปฏิเสธ","",()=>rmF(f.id))));
  else fl.append(frow(p.name,sub+" · รอตอบรับ",bt("ยกเลิก","",()=>rmF(f.id))))});
 $("rqh").hidden=!rq.children.length;if(!fl.children.length)fl.append(el("p",{className:"note",textContent:"ยังไม่มีเพื่อน ค้นหาชื่อผู้ใช้ด้านบน หรือส่งลิงก์เชิญ"}))}
setInterval(()=>{if(me&&!$("home").hidden)loadFriends()},15000);
async function openFriend(f,call){if(room)return;const b=new TextEncoder().encode([me.id,f.id].sort().join("|")),hx=[...new Uint8Array(await crypto.subtle.digest("SHA-256",b))].map(x=>x.toString(16).padStart(2,"0")).join("").slice(0,32);
 hmsg("กำลังเชื่อมต่อ…");try{room=await joinRoom("duo-"+hx)}catch(e){console.error(e);hmsg("เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง");return}hmsg("");
 code=hx;showS("main");$("rc").textContent=f.name;room.presence({n:myProf.name});room.onPeers(render);room.onConnection(render);room.on("rtc",onRtc);render();
 if(call){wantCall=true;inboxSend(f.id,{t:"ring",from:me.id,name:myProf.name});callUI("กำลังเรียก "+f.name+"…");setTimeout(()=>{if(wantCall&&!inCall){wantCall=false;inboxSend(f.id,{t:"cancel",from:me.id});callUI("ไม่มีคนรับสาย")}},40000)}}
function onRing(p){if(!p||p.from===(me&&me.id))return;if(p.t==="cancel"){if(ringIn&&ringIn.from===p.from){ringIn=null;$("pop").hidden=true}return}
 if(room||inCall||!friends.some(x=>x.id===p.from))return;ringIn=p;$("pop").className="ring";$("pname").textContent=String(p.name||"เพื่อน");$("pav").textContent=[...String(p.name||"?")][0];$("ptxt").textContent="กำลังโทรหาคุณ…";$("pring").hidden=false;$("pcall").hidden=true;$("pop").hidden=false;try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
$("copy").onclick=()=>{wantCall=false;if(inCall)endCall(true);if(sharing)$("share").click();room.leave();room=null;callUI("");showS("home");loadFriends()};

const others=()=>room?room.peers().filter(p=>!p.isMe&&p.kind==="viewer"):[];
const myPeer=()=>room&&room.peers().find(p=>p.sameTab);
function geo(a,b){const R=6371000,r=Math.PI/180,dx=(b.lng-a.lng)*r*R*Math.cos((a.lat+b.lat)/2*r),dy=(b.lat-a.lat)*r*R;return{dx,dy,d:Math.hypot(dx,dy)}}
const fmt=d=>d<1000?Math.round(d)+" ม.":(d/1000).toFixed(1)+" กม.";

function render(){if(!room)return;const o=others(),p=o[0],pr=p?p.presence:{},on=room.connected();
 $("conn").textContent=on?"เชื่อมต่อแล้ว":"กำลังเชื่อมต่อ";$("conn").className="pill"+(on?" on":"");
 $("who").textContent=p?(String(pr.n||"คู่ของคุณ")+" อยู่ในห้อง"):"รอคู่ของคุณเข้าห้อง…";
 $("warn").textContent=o.length>1?"มีมากกว่า 2 คนในห้องนี้ ถ้าไม่ใช่คนที่คุณรู้จัก ให้ออกและสร้างห้องใหม่":"";
 $("call").disabled=!p&&!inCall;$("call").textContent=inCall?"วางสาย":"โทรหาคู่";
 const has=pr.lat!=null&&pr.lng!=null;let t="";
 if(has&&myPos){const g=geo(myPos,pr);const dir=DIR[Math.round(((Math.atan2(g.dx,-g.dy)*180/Math.PI+360)%360)/45)%8];
  $("dist").textContent="ห่างกัน "+fmt(g.d);t="คู่ของคุณอยู่ทางทิศ"+dir}
 else if(has){$("dist").textContent="เห็นตำแหน่งคู่แล้ว";t="กดแชร์ตำแหน่งของคุณเพื่อดูระยะห่าง"}
 else{$("dist").textContent=p?"คู่ของคุณยังไม่ได้แชร์ตำแหน่ง":"รอตำแหน่ง";t=sharing?"คุณกำลังแชร์ตำแหน่งอยู่":""}
 if(has&&pr.t){const s=Math.max(0,Math.round((Date.now()-pr.t)/1000));t+=" · อัปเดต "+(s<60?s+" วินาที":Math.round(s/60)+" นาที")+"ที่แล้ว"+(s>120?" (อาจไม่เป็นปัจจุบัน)":"")}
 $("sub").textContent=t;const a=$("map");if(has&&isFinite(pr.lat)&&isFinite(pr.lng)){a.href="https://www.google.com/maps?q="+(+pr.lat).toFixed(5)+","+(+pr.lng).toFixed(5);a.hidden=false}else a.hidden=true;
 draw(has?pr:null,String(pr.n||"คู่"));if(wantCall&&p&&!inCall&&!$("call").disabled){wantCall=false;$("call").click()}}
setInterval(render,1000);addEventListener("resize",render);

const fmt0=()=>$("dist").textContent.replace(/^เห็น.*|^รอ.*|^คู่.*/,"");
function draw(pr,pn){const c=$("cv"),d=devicePixelRatio||1,w=c.clientWidth,hh=c.clientHeight;c.width=w*d;c.height=hh*d;const g=c.getContext("2d");g.scale(d,d);
 const pts=[];if(myPos)pts.push({lat:myPos.lat,lng:myPos.lng,c:css("--me"),n:"ฉัน",k:"me"});if(pr)pts.push({lat:pr.lat,lng:pr.lng,c:css("--you"),n:pn,k:"you",sub:fmt0()});
 if(gmOK){drawMap(pts);return}$("cv").hidden=false;$("gm").hidden=true;
 g.font='500 13px Prompt,sans-serif';g.textAlign="center";g.fillStyle=css("--muted");
 if(!pts.length){g.fillText("ยังไม่มีตำแหน่งให้แสดง",w/2,hh/2);return}
 const lat0=pts.reduce((s,p)=>s+p.lat,0)/pts.length,lng0=pts.reduce((s,p)=>s+p.lng,0)/pts.length,k=Math.PI/180;
 pts.forEach(p=>{p.x=(p.lng-lng0)*k*6371000*Math.cos(lat0*k);p.y=-(p.lat-lat0)*k*6371000});
 const span=Math.max(25,...pts.map(p=>Math.hypot(p.x,p.y))),s=Math.min(w,hh)*.34/span,cx=w/2,cy=hh/2,raw=70/s,pw=Math.pow(10,Math.floor(Math.log10(raw))),step=[1,2,5,10].find(m=>m*pw>=raw)*pw;
 g.strokeStyle=css("--grid");g.lineWidth=1;g.beginPath();
 for(let x=Math.ceil(-cx/s/step)*step;x*s<cx;x+=step){g.moveTo(cx+x*s,0);g.lineTo(cx+x*s,hh)}
 for(let y=Math.ceil(-cy/s/step)*step;y*s<cy;y+=step){g.moveTo(0,cy+y*s);g.lineTo(w,cy+y*s)}g.stroke();
 g.fillStyle=css("--muted");g.textAlign="left";g.font='12px Prompt,sans-serif';g.fillText("ช่องละ "+fmt(step)+" · เหนืออยู่ด้านบน",10,hh-10);
 if(pts.length===2){g.setLineDash([6,6]);g.strokeStyle=css("--muted");g.beginPath();g.moveTo(cx+pts[0].x*s,cy+pts[0].y*s);g.lineTo(cx+pts[1].x*s,cy+pts[1].y*s);g.stroke();g.setLineDash([])}
 g.textAlign="center";pts.forEach(p=>{const X=cx+p.x*s,Y=cy+p.y*s;g.fillStyle=p.c;g.globalAlpha=.25;g.beginPath();g.arc(X,Y,18,0,7);g.fill();g.globalAlpha=1;g.beginPath();g.arc(X,Y,9,0,7);g.fill();g.font='500 13px Prompt,sans-serif';g.fillText(p.n,X,Y-18)})}

$("share").onclick=()=>{if(sharing){navigator.geolocation.clearWatch(watch);sharing=false;myPos=null;room.presence({lat:null,lng:null,acc:null,t:null});$("share").textContent="แชร์ตำแหน่งของฉัน";render();return}
 if(!navigator.geolocation){alert("อุปกรณ์นี้ไม่รองรับการหาตำแหน่ง");return}
 watch=navigator.geolocation.watchPosition(p=>{sharing=true;myPos={lat:p.coords.latitude,lng:p.coords.longitude};
  room.presence({lat:+myPos.lat.toFixed(5),lng:+myPos.lng.toFixed(5),acc:Math.round(p.coords.accuracy),t:Date.now()});$("share").textContent="หยุดแชร์ตำแหน่ง";render()},
  e=>{sharing=false;$("share").textContent="แชร์ตำแหน่งของฉัน";alert(e.code===1?"ไม่ได้รับอนุญาตให้ใช้ตำแหน่ง ลองเปิดสิทธิ์ในเบราว์เซอร์หรือเปิดหน้านี้ในแท็บของตัวเอง":"หาตำแหน่งไม่สำเร็จ ลองใหม่อีกครั้ง")},{enableHighAccuracy:true,maximumAge:5000})};

// โทรเสียง (WebRTC) ส่งสัญญาณผ่านห้องเรียลไทม์
const send=(o,to)=>room.emit("rtc",{...o,to:to||callPeer}).catch(()=>{});
const callUI=(t,ring)=>{$("callbar").hidden=!t;$("calltxt").textContent=t||"";$("ringbtns").hidden=!ring;
 const show=!!t&&(ring||inCall),pn=String((others()[0]||{presence:{}}).presence.n||"คู่ของคุณ");$("pop").hidden=!show;
 if(show){$("pop").className=ring?"ring":"";$("pname").textContent=pn;$("pav").textContent=[...pn][0];$("ptxt").textContent=ring?"กำลังโทรหาคุณ…":t;$("pring").hidden=!ring;$("pcall").hidden=!!ring;$("wkl").hidden=!!ring;if(ring)$("ptt").hidden=true}};
$("acc2").onclick=()=>{if(ringIn){const f=friends.find(x=>x.id===ringIn.from);ringIn=null;$("pop").hidden=true;if(f){autoAcc=true;openFriend(f,false)}}else $("acc").click()};
$("dec2").onclick=()=>{if(ringIn){ringIn=null;$("pop").hidden=true}else $("dec").click()};$("hang").onclick=()=>$("call").click();
let wkOn=false;
function applyWk(){if(!stream)return;const t=stream.getAudioTracks()[0];if(t)t.enabled=!wkOn;$("ptt").hidden=!wkOn;$("mute").parentElement.hidden=wkOn}
function talk(on){if(!stream||!wkOn)return;const t=stream.getAudioTracks()[0];if(t)t.enabled=on;$("ptt").classList.toggle("on",on);$("ptt").textContent=on?"กำลังพูด… ปล่อยเพื่อฟัง":"กดค้างเพื่อพูด";if(inCall)send({t:"talk",on});if(on)try{navigator.vibrate&&navigator.vibrate(20)}catch(e){}}
$("wk").onchange=()=>{wkOn=$("wk").checked;applyWk()};
$("ptt").onpointerdown=e=>{e.preventDefault();try{$("ptt").setPointerCapture(e.pointerId)}catch(x){}talk(true)};
["pointerup","pointercancel"].forEach(v=>$("ptt")["on"+v]=()=>talk(false));
$("ptt").oncontextmenu=e=>e.preventDefault();
$("mute").onclick=()=>{if(!stream)return;const t=stream.getAudioTracks()[0];if(!t)return;t.enabled=!t.enabled;$("mute").classList.toggle("on",!t.enabled);$("mute").textContent=t.enabled?"🎙":"🔇"};
function mkPC(to){callPeer=to;const p=new RTCPeerConnection({iceServers:DUO_CONFIG.ICE});
 p.onicecandidate=e=>{if(e.candidate)send({t:"ice",c:e.candidate.toJSON()})};p.ontrack=e=>{$("ra").srcObject=e.streams[0]};
 p.onconnectionstatechange=()=>{if(p.connectionState==="connected")callUI("กำลังคุยสาย");if(p.connectionState==="failed"){callUI("เชื่อมต่อสายไม่ได้ อาจเพราะเครือข่ายบล็อก");endCall(true)}if(p.connectionState==="disconnected")setTimeout(()=>{if(pc===p&&p.connectionState!=="connected")endCall(false)},4000)};return p}
async function mic(){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});applyWk();return true}catch(e){callUI("เปิดไมโครโฟนไม่ได้ ต้องอนุญาตสิทธิ์ไมค์ หรือเปิดหน้านี้ในแท็บของตัวเอง");return false}}
function endCall(notify){$("ptt").classList.remove("on");$("ptt").textContent="กดค้างเพื่อพูด";$("pop").hidden=true;$("mute").classList.remove("on");$("mute").textContent="🎙";if(notify&&callPeer)send({t:"bye"});if(pc)pc.close();pc=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;pend=[];incoming=null;inCall=false;$("ra").srcObject=null;setTimeout(()=>{if(!pc&&!incoming)callUI("")},2500);render()}
$("call").onclick=async()=>{if(inCall){endCall(true);callUI("วางสายแล้ว");return}const p=others()[0];if(!p||!await mic())return;
 inCall=true;pc=mkPC(p.peer);stream.getTracks().forEach(t=>pc.addTrack(t,stream));callUI("กำลังโทรหาคู่ของคุณ…");
 const o=await pc.createOffer();await pc.setLocalDescription(o);send({t:"offer",sdp:pc.localDescription.toJSON()});render()};
async function onRtc(m){const d=m.data,mp=myPeer();if(m.isMe||!d||!mp||d.to!==mp.peer)return;
 if(d.t==="offer"){if(inCall){send({t:"bye"},m.peer);return}incoming={sdp:d.sdp,from:m.peer};callUI((m.presence&&m.presence.n||"คู่ของคุณ")+" กำลังโทรหา",true);if(autoAcc){autoAcc=false;setTimeout(()=>$("acc").click(),0)}try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
 else if(d.t==="answer"&&pc){await pc.setRemoteDescription(d.sdp);pend.forEach(c=>pc.addIceCandidate(c).catch(()=>{}));pend=[]}
 else if(d.t==="ice"){if(pc&&pc.remoteDescription)pc.addIceCandidate(d.c).catch(()=>{});else pend.push(d.c)}
 else if(d.t==="talk"&&inCall){const pn=String((others()[0]||{presence:{}}).presence.n||"คู่ของคุณ");$("ptxt").textContent=d.on?pn+" กำลังพูด…":"กำลังคุยสาย"}
 else if(d.t==="bye"){if(incoming&&!pc){incoming=null;callUI("สายที่ไม่ได้รับ")}else{endCall(false);callUI("คู่ของคุณวางสายแล้ว")}}}
$("acc").onclick=async()=>{if(!incoming||!await mic())return;const i=incoming;incoming=null;inCall=true;pc=mkPC(i.from);stream.getTracks().forEach(t=>pc.addTrack(t,stream));
 await pc.setRemoteDescription(i.sdp);pend.forEach(c=>pc.addIceCandidate(c).catch(()=>{}));pend=[];const a=await pc.createAnswer();await pc.setLocalDescription(a);
 send({t:"answer",sdp:pc.localDescription.toJSON()});callUI("กำลังเชื่อมต่อสาย…");render()};
$("dec").onclick=()=>{if(incoming)send({t:"bye"},incoming.from);incoming=null;callUI("")};
if(cfgBad||!sb){err("ยังไม่ได้ตั้งค่า SUPABASE_URL / SUPABASE_ANON_KEY ใน config.js")}else{sb.auth.getSession().then(({data})=>onSession(data.session));sb.auth.onAuthStateChange((e,ss)=>{if(e==="SIGNED_IN"||e==="SIGNED_OUT")onSession(ss)})}
</script>
